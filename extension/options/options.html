<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Vaultix Settings</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 420px;
        margin: 40px auto;
        padding: 0 16px;
        color: #1e293b;
      }
      label {
        display: block;
        font-weight: 600;
        margin-bottom: 6px;
      }
      input {
        width: 100%;
        padding: 9px 10px;
        border: 1px solid #cbd5e1;
        border-radius: 8px;
        font-size: 14px;
        box-sizing: border-box;
      }
      button {
        margin-top: 12px;
        padding: 9px 18px;
        background: #4f46e5;
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
      .status {
        margin-left: 10px;
        color: #16a34a;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <h1>Vaultix Extension</h1>
    <p>Set the address of your Vaultix server.</p>
    <form id="form">
      <label for="baseUrl">Vaultix URL</label>
      <input id="baseUrl" type="url" placeholder="https://knbitrix.duckdns.org" required />
      <button type="submit">Save</button>
      <button type="button" id="testBtn">Test connection</button>
      <span class="status" id="status"></span>
    </form>
    <p>Extension version <span id="version"></span></p>
    <script src="options.js"></script>
  </body>
</html>
